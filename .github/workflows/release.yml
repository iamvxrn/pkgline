name: Release Binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build Cross-Platform Artifacts
        run: |
          mkdir -p dist

          GOOS=linux GOARCH=amd64 go build -o dist/pkgline .
          tar -czf "dist/pkgline_linux_amd64.tar.gz" -C dist pkgline
          rm -f dist/pkgline

          GOOS=linux GOARCH=arm64 go build -o dist/pkgline .
          tar -czf "dist/pkgline_linux_arm64.tar.gz" -C dist pkgline
          rm -f dist/pkgline

          GOOS=darwin GOARCH=arm64 go build -o dist/pkgline .
          tar -czf "dist/pkgline_darwin_arm64.tar.gz" -C dist pkgline
          rm -f dist/pkgline

          GOOS=darwin GOARCH=amd64 go build -o dist/pkgline .
          tar -czf "dist/pkgline_darwin_amd64.tar.gz" -C dist pkgline
          rm -f dist/pkgline

          GOOS=windows GOARCH=amd64 go build -o dist/pkgline.exe .
          zip -j "dist/pkgline_windows_amd64.zip" dist/pkgline.exe
          rm -f dist/pkgline.exe

          cd dist && sha256sum *.tar.gz *.zip > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
